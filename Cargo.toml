[package]
name = "erc721-ux-leptos"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = "1.7.3"
alloy-sol-types = "1.7.3"
console_error_panic_hook = "0.1.7"
futures = { version = "0.3.34", default-features = false, features = ["std"] }
gloo-net = "0.8.0"
gloo-timers = { version = "0.4.1", features = ["futures"] }
js-sys = "0.3.107"
leptos = { version = "0.8.23", features = ["csr"] }
leptos_router = "0.8.17"
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
serde_json = "1.0.154"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = "0.3.107"
